[package]
name = "cratical"
version = "0.1.3"
authors = ["Danila Volkov <danila.volkov@noxlovette.com>"]
description = "A strict, spec-driven iCalendar (RFC 5545) and vCard (RFC 6350/2426) parser and builder, with RFC 5546 (iTIP), 6868, 7953, 7986, and 9074 support"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/noxlovette/cratical"
readme = "README.md"
keywords = ["icalendar", "ical", "vcard", "carddav", "ics"]
categories = ["date-and-time", "parser-implementations"]
exclude = ["tests/fixtures/**"]

[dependencies]
chrono = { version = "0.4.45" }
base64 = "0.23"
bytes = "1.12"
chrono-tz = "0.10.4"
langtag = "1.1.0"
memchr = "2"
nanoid = "0.5.0"
phf = { version = "0.14", features = ["macros"] }
thiserror = "2"
url = "2.5.8"

[features]
default = ["rfc-7953", "rfc-9074"]
# RFC 7953: VAVAILABILITY calendar availability component.
rfc-7953 = []
# RFC 9073 VLOCATION (nested inside VALARM) and the RFC 9074 VALARM
# extensions (UID, RELATED-TO, ACKNOWLEDGED, PROXIMITY).
rfc-9074 = []
# RFC 5546: iTIP, the iCalendar Transport-Independent Interoperability
# Protocol. Adds a typed scheduling `METHOD` (`itip::Method`) and validates
# a VCALENDAR against RFC 5546's per-METHOD component/property restriction
# tables whenever METHOD names one of the 8 recognized iTIP methods.
rfc-5546 = []
# vCard, the payload CardDAV (RFC 6352) carries. This crate is payload-only
# (no WebDAV/HTTP/XML), so "CardDAV support" means parsing, building,
# validating and serializing vCard objects. Opt-in: plain calendar users
# don't need it.
# RFC 6350: vCard 4.0, the base of the `vcard` module.
rfc-6350 = []
# RFC 2426: vCard 3.0, plus 3.0 <-> 4.0 conversion. Implies `rfc-6350`
# because the typed model is the 4.0 one and 3.0 is mapped onto it.
rfc-2426 = ["rfc-6350"]
